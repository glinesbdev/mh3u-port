[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[workspace.lints.rust]
# the runtime crate (mh3u-rt) is the only place that may use unsafe; it allows it in its own Cargo.toml (see docs/code-guidelines.md)
unsafe_code = "forbid"

[workspace.dependencies]
anyhow = "1"
flate2 = "1"
clap = { version = "4", features = ["derive"] }
memchr = "2"
libm = "0.2"
mh3u-formats = { path = "crates/mh3u-formats" }
mh3u-dump = { path = "crates/mh3u-dump" }
mh3u-cemu = { path = "crates/mh3u-cemu" }
mh3u-ppc = { path = "crates/mh3u-ppc" }
mh3u-recomp = { path = "crates/mh3u-recomp" }
mh3u-testkit = { path = "crates/mh3u-testkit" }
mh3u-latte = { path = "crates/mh3u-latte" }
mh3u-audio = { path = "crates/mh3u-audio" }
mh3u-mods = { path = "crates/mh3u-mods" }

[profile.release]
lto = "fat"
codegen-units = 1
