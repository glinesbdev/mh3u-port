[package]
name = "mh3u-rt"
version.workspace = true
edition.workspace = true
license.workspace = true

# the one crate that may use `unsafe` (see docs/code-guidelines.md): the guest's memory and the calls into the translated library
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
undocumented_unsafe_blocks = "warn"

[dependencies]
anyhow.workspace = true
gilrs = "0.11"
mh3u-formats.workspace = true
mh3u-audio.workspace = true
libloading = "0.8"

[target.'cfg(unix)'.dependencies]
memmap2 = "0.9"

# the guest's memory is reserved and committed on first touch (see src/memory.rs)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_Memory"] }
