name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # cpal links ALSA; winit's Wayland backend wants these at build time. The game itself is not built.
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libxkbcommon-dev libwayland-dev libudev-dev
      - name: Format, clippy, tests, archive layout, recomplauncher.json
        run: |
          python -m pip install jsonschema
          scripts/check.sh
